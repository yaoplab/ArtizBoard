<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtizBoard — Portail Client</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Nav -->
    <nav id="nav">
      <button class="nav-btn active" data-tab="accueil">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Accueil</span>
      </button>
      <button class="nav-btn" data-tab="carte">
        <span class="nav-icon">🍽️</span>
        <span class="nav-label">Carte</span>
      </button>
      <button class="nav-btn" data-tab="apropos">
        <span class="nav-icon">ℹ️</span>
        <span class="nav-label">À Propos</span>
      </button>
      <button class="nav-btn" data-tab="contact">
        <span class="nav-icon">📞</span>
        <span class="nav-label">Contact</span>
      </button>
      <button class="nav-btn cart-btn" id="cartBtn">
        <span class="nav-icon">🛒</span>
        <span class="cart-badge" id="cartBadge">0</span>
      </button>
    </nav>

    <!-- Content -->
    <main id="content"></main>

    <!-- Cart drawer -->
    <div id="cartOverlay" class="overlay hidden"></div>
    <div id="cartDrawer" class="drawer hidden">
      <div class="drawer-header">
        <h2>Votre panier</h2>
        <button id="cartClose" class="btn-icon">✕</button>
      </div>
      <div id="cartItems" class="drawer-body"></div>
      <div class="drawer-footer">
        <div class="cart-total">
          <span>Total</span>
          <span id="cartTotal">0 FCFA</span>
        </div>
        <button id="checkoutBtn" class="btn btn-primary btn-block" disabled>
          Commander
        </button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
