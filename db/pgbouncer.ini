;; =====================================================================
;; ArtizBoard — PgBouncer Configuration
;; Livrable A — configuration de référence
;;
;; Emplacement : /etc/pgbouncer/pgbouncer.ini (Linux)
;;             ou C:\Program Files\PgBouncer\pgbouncer.ini (Windows)
;; =====================================================================

[databases]
artizboard_local = host=127.0.0.1 port=5432 dbname=artizboard_local

[pgbouncer]
;; ── Réseau ──
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = C:\projet\db\pgbouncer_users.txt

;; ── Connexions ──
pool_mode = transaction
default_pool_size = 25
max_client_conn = 150
max_db_connections = 30

;; ── Timeouts ──
server_idle_timeout = 600
client_idle_timeout = 0
server_lifetime = 3600

;; ── Logs ──
logfile = C:\projet\pgbouncer.log
stats_period = 60

;; ── Mode intranet ──
;; ignore_startup_parameters = extra_float_digits  ; si besoin compatibilité clients
