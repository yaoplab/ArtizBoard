[database]
host = 127.0.0.1
port = 5432
name = artizboard_local
user = artizboard
password = votre_mot_de_passe

[pgbouncer]
pool_size = 25
max_client_conn = 150
pool_mode = transaction

[supabase]
url = ${SUPABASE_URL}
anon_key = ${SUPABASE_ANON_KEY}
service_role_key = ${SUPABASE_SERVICE_ROLE_KEY}

[sync]
enabled = true
interval_seconds = 10
tables = etablissements,utilisateurs,categories,produits,commandes,lignes_commande,faqs,pages_etablissement,theme_config

[auth]
jwt_secret_key = changez-cette-cle-en-production-32+
jwt_algorithm = HS256
jwt_expiry_minutes = 60
refresh_token_expiry_days = 7

[backup]
directory = C:\projet\backups
retention_weekly = 4
retention_monthly = 4
retention_yearly = 1
encryption_passphrase = changez-cette-passphrase-en-production

[server]
host = 0.0.0.0
port = 8080
static_dir = C:\projet\static
upload_dir = C:\projet\uploads

[hostinger]
ftp_host =
ftp_port = 21
ftp_user =
ftp_password =
wordpress_url =
wordpress_user =
wordpress_app_password =

[payment]
gateway = simulated
tmoney_api_url =
tmoney_api_key =
flooz_api_url =
flooz_api_key =
